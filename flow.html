<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flow · The Moving Dot</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="manifest" href="/manifest.json">
    <meta name="description" content="Perspectives on transport and urban movement — positions, evidence, and shareable artifacts on how cities flow">
    <meta property="og:title" content="Flow · The Moving Dot">
    <meta property="og:description" content="Perspectives on transport and urban movement — positions, evidence, and shareable artifacts on how cities flow">
    <meta property="og:type" content="website">
    <meta property="og:image" content="https://themovingdot.com/assets/og-image.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://themovingdot.com/assets/og-image.png">
    <meta name="twitter:title" content="Flow · The Moving Dot">
    <meta name="twitter:description" content="Perspectives on transport and urban movement — positions, evidence, and shareable artifacts on how cities flow">
    <meta name="theme-color" content="#000000">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@300;400;600&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root[data-theme="dark"] {
            --bg-primary: #000000;
            --bg-secondary: rgba(19, 19, 26, 0.8);
            --text-primary: #e8e8e8;
            --text-secondary: #a0a0a8;
            --gradient-opacity: 0.15;
            --card-border: rgba(255, 255, 255, 0.1);
            --chat-bg: rgba(20, 20, 20, 0.98);
        }

        :root[data-theme="light"] {
            --bg-primary: #ffffff;
            --bg-secondary: rgba(249, 249, 251, 0.9);
            --text-primary: #1a1a1a;
            --text-secondary: #666666;
            --gradient-opacity: 0.08;
            --card-border: rgba(0, 0, 0, 0.1);
            --chat-bg: rgba(255, 255, 255, 0.98);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            min-height: 100vh;
            overflow-x: hidden;
            background: var(--bg-primary);
            cursor: none;
            font-family: 'DM Sans', sans-serif;
            color: var(--text-primary);
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* Flowing gradient background */
        .bg-gradient {
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background:
                radial-gradient(circle at 20% 50%, rgba(139, 69, 197, var(--gradient-opacity)) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(52, 152, 219, var(--gradient-opacity)) 0%, transparent 50%),
                radial-gradient(circle at 40% 20%, rgba(231, 76, 60, calc(var(--gradient-opacity) * 0.8)) 0%, transparent 50%),
                radial-gradient(circle at 60% 60%, rgba(241, 196, 15, calc(var(--gradient-opacity) * 0.67)) 0%, transparent 50%);
            animation: flow 20s ease-in-out infinite;
            z-index: 0;
            transition: opacity 0.3s ease;
        }

        @keyframes flow {
            0%, 100% {
                transform: translate(0, 0) rotate(0deg);
            }
            33% {
                transform: translate(10%, 10%) rotate(120deg);
            }
            66% {
                transform: translate(-5%, 5%) rotate(240deg);
            }
        }

        /* Custom cursor */
        .cursor {
            width: 40px;
            height: 40px;
            border: 2px solid;
            border-radius: 50%;
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            transition: transform 0.15s ease-out;
            transform: translate(-50%, -50%);
            animation: cursorColor 8s ease-in-out infinite;
        }

        @keyframes cursorColor {
            0%, 100% { border-color: rgba(139, 69, 197, 0.6); }
            25% { border-color: rgba(52, 152, 219, 0.6); }
            50% { border-color: rgba(231, 76, 60, 0.6); }
            75% { border-color: rgba(241, 196, 15, 0.6); }
        }

        .cursor-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            position: fixed;
            pointer-events: none;
            z-index: 10000;
            transform: translate(-50%, -50%);
            transition: transform 0.05s ease-out;
            animation: dotColor 8s ease-in-out infinite;
        }

        @keyframes dotColor {
            0%, 100% { background: #8b45c5; box-shadow: 0 0 15px #8b45c5; }
            25% { background: #3498db; box-shadow: 0 0 15px #3498db; }
            50% { background: #e74c3c; box-shadow: 0 0 15px #e74c3c; }
            75% { background: #f1c40f; box-shadow: 0 0 15px #f1c40f; }
        }

        /* Canvas for particles */
        #canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            opacity: 0.4;
        }

        /* Container */
        .container {
            position: relative;
            z-index: 2;
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
            min-height: 100vh;
        }

        /* Header */
        header {
            padding: 2rem 0 3rem 0;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 0.6rem;
        }

        .logo {
            font-family: 'Crimson Pro', serif;
            font-size: 1.5rem;
            font-weight: 300;
            letter-spacing: 0.5px;
            color: var(--text-primary);
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .logo .dot-accent {
            animation: logoColor 8s ease-in-out infinite;
            font-size: 2rem;
            vertical-align: middle;
        }

        @keyframes logoColor {
            0%, 100% { color: #8b45c5; }
            25% { color: #3498db; }
            50% { color: #e74c3c; }
            75% { color: #f1c40f; }
        }

        .back-link {
            color: #a0a0a8;
            text-decoration: none;
            font-size: 0.9rem;
            letter-spacing: 1px;
            transition: color 0.3s ease;
            animation: backColor 8s ease-in-out infinite;
        }

        @keyframes backColor {
            0%, 100% { color: rgba(139, 69, 197, 0.8); }
            25% { color: rgba(52, 152, 219, 0.8); }
            50% { color: rgba(231, 76, 60, 0.8); }
            75% { color: rgba(241, 196, 15, 0.8); }
        }

        .back-link:hover {
            opacity: 1;
        }

        /* Title */
        .page-title {
            font-family: 'Crimson Pro', serif;
            font-size: 4rem;
            font-weight: 300;
            text-align: center;
            margin-bottom: 1rem;
            letter-spacing: -1px;
        }

        .page-subtitle {
            text-align: center;
            color: var(--text-secondary);
            font-size: 1.1rem;
            margin-bottom: 6rem;
            font-style: italic;
            transition: color 0.3s ease;
        }

        /* Flow Badge */
        .flow-badge {
            display: inline-block;
            padding: 0.5rem 1rem;
            background: rgba(139, 69, 197, 0.1);
            border: 1px solid rgba(139, 69, 197, 0.3);
            border-radius: 20px;
            font-size: 0.75rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 1rem;
            animation: badgeColor 8s ease-in-out infinite;
        }

        @keyframes badgeColor {
            0%, 100% {
                background: rgba(139, 69, 197, 0.1);
                border-color: rgba(139, 69, 197, 0.3);
                color: rgba(139, 69, 197, 0.9);
            }
            25% {
                background: rgba(52, 152, 219, 0.1);
                border-color: rgba(52, 152, 219, 0.3);
                color: rgba(52, 152, 219, 0.9);
            }
            50% {
                background: rgba(231, 76, 60, 0.1);
                border-color: rgba(231, 76, 60, 0.3);
                color: rgba(231, 76, 60, 0.9);
            }
            75% {
                background: rgba(241, 196, 15, 0.1);
                border-color: rgba(241, 196, 15, 0.3);
                color: rgba(241, 196, 15, 0.9);
            }
        }

        /* Flow Grid */
        .flow-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 3rem;
            margin-bottom: 6rem;
        }

        /* Flow Card */
        .flow-card {
            position: relative;
            background: var(--bg-secondary);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 3rem 2rem;
            text-decoration: none;
            color: var(--text-primary);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(10px);
            overflow: hidden;
            display: block;
        }

        .flow-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg,
                rgba(139, 69, 197, 0.8),
                rgba(52, 152, 219, 0.8),
                rgba(231, 76, 60, 0.8),
                rgba(241, 196, 15, 0.8));
            transform: scaleX(0);
            transform-origin: left;
            transition: transform 0.4s ease;
            background-size: 200% 100%;
            animation: gradientShift 8s ease-in-out infinite;
        }

        @keyframes gradientShift {
            0%, 100% { background-position: 0% 0%; }
            50% { background-position: 100% 0%; }
        }

        .flow-card:hover::before {
            transform: scaleX(1);
        }

        .flow-card::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(139, 69, 197, 0.1), transparent);
            transform: translate(-50%, -50%);
            transition: width 0.6s ease, height 0.6s ease;
            z-index: 0;
        }

        .flow-card:hover::after {
            width: 500px;
            height: 500px;
        }

        .flow-card:hover {
            transform: translateY(-12px);
            border-color: rgba(139, 69, 197, 0.4);
            box-shadow: 0 20px 60px rgba(139, 69, 197, 0.2);
        }

        .flow-card-content {
            position: relative;
            z-index: 1;
        }

        .flow-icon {
            width: 60px;
            height: 60px;
            margin-bottom: 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            border-radius: 12px;
            background: rgba(139, 69, 197, 0.1);
            border: 1px solid rgba(139, 69, 197, 0.3);
            transition: all 0.4s ease;
        }

        .flow-card:hover .flow-icon {
            background: rgba(139, 69, 197, 0.2);
            border-color: rgba(139, 69, 197, 0.5);
            transform: scale(1.1) rotate(5deg);
        }

        .flow-card:nth-child(2) .flow-icon {
            background: rgba(52, 152, 219, 0.1);
            border-color: rgba(52, 152, 219, 0.3);
        }

        .flow-card:nth-child(2):hover .flow-icon {
            background: rgba(52, 152, 219, 0.2);
            border-color: rgba(52, 152, 219, 0.5);
        }

        .flow-card:nth-child(3) .flow-icon {
            background: rgba(231, 76, 60, 0.1);
            border-color: rgba(231, 76, 60, 0.3);
        }

        .flow-card:nth-child(3):hover .flow-icon {
            background: rgba(231, 76, 60, 0.2);
            border-color: rgba(231, 76, 60, 0.5);
        }

        .flow-card:nth-child(4) .flow-icon {
            background: rgba(241, 196, 15, 0.1);
            border-color: rgba(241, 196, 15, 0.3);
        }

        .flow-card:nth-child(4):hover .flow-icon {
            background: rgba(241, 196, 15, 0.2);
            border-color: rgba(241, 196, 15, 0.5);
        }

        .flow-card:nth-child(5) .flow-icon {
            background: rgba(46, 204, 113, 0.1);
            border-color: rgba(46, 204, 113, 0.3);
        }

        .flow-card:nth-child(5):hover .flow-icon {
            background: rgba(46, 204, 113, 0.2);
            border-color: rgba(46, 204, 113, 0.5);
        }

        .flow-card:nth-child(6) .flow-icon {
            background: rgba(155, 89, 182, 0.1);
            border-color: rgba(155, 89, 182, 0.3);
        }

        .flow-card:nth-child(6):hover .flow-icon {
            background: rgba(155, 89, 182, 0.2);
            border-color: rgba(155, 89, 182, 0.5);
        }

        .flow-title {
            font-family: 'Crimson Pro', serif;
            font-size: 1.8rem;
            font-weight: 400;
            margin-bottom: 1rem;
            line-height: 1.3;
        }

        .flow-description {
            color: var(--text-secondary);
            line-height: 1.8;
            margin-bottom: 1.5rem;
            font-size: 0.95rem;
            transition: color 0.3s ease;
        }

        /* Format links row */
        .flow-formats {
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
        }

        .flow-format-tag {
            font-size: 0.75rem;
            letter-spacing: 0.5px;
            padding: 0.35rem 0.75rem;
            border-radius: 12px;
            background: rgba(139, 69, 197, 0.08);
            border: 1px solid rgba(139, 69, 197, 0.2);
            color: var(--text-secondary);
            transition: all 0.3s ease;
        }

        .flow-card:nth-child(2) .flow-format-tag {
            background: rgba(52, 152, 219, 0.08);
            border-color: rgba(52, 152, 219, 0.2);
        }

        .flow-card:nth-child(3) .flow-format-tag {
            background: rgba(231, 76, 60, 0.08);
            border-color: rgba(231, 76, 60, 0.2);
        }

        .flow-card:nth-child(4) .flow-format-tag {
            background: rgba(241, 196, 15, 0.08);
            border-color: rgba(241, 196, 15, 0.2);
        }

        .flow-card:nth-child(5) .flow-format-tag {
            background: rgba(46, 204, 113, 0.08);
            border-color: rgba(46, 204, 113, 0.2);
        }

        .flow-card:nth-child(6) .flow-format-tag {
            background: rgba(155, 89, 182, 0.08);
            border-color: rgba(155, 89, 182, 0.2);
        }

        /* Teaser shown until the first perspectives land */
        .flow-teaser {
            max-width: 640px;
            margin: 0 auto;
            padding: 4rem 2rem 6rem;
            text-align: center;
        }

        .flow-teaser-accent {
            width: 40px;
            height: 1px;
            margin: 0 auto 40px;
            opacity: 0.4;
            background: currentColor;
            color: #8b45c5;
        }

        .flow-teaser-title {
            font-family: 'Crimson Pro', serif;
            font-size: clamp(1.8rem, 4vw, 2.6rem);
            font-weight: 300;
            color: var(--text-primary);
            margin-bottom: 28px;
            line-height: 1.25;
            letter-spacing: 1px;
        }

        .flow-teaser-text {
            font-family: 'DM Sans', system-ui, sans-serif;
            font-size: clamp(0.95rem, 2vw, 1.05rem);
            color: var(--text-secondary);
            line-height: 1.9;
            margin-bottom: 20px;
        }

        .flow-teaser-quote {
            font-family: 'Crimson Pro', serif;
            font-size: clamp(1.15rem, 2.5vw, 1.45rem);
            font-weight: 300;
            font-style: italic;
            color: var(--text-primary);
            opacity: 0.8;
            margin-top: 28px;
            line-height: 1.6;
        }

        .flow-teaser-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin: 44px auto 0;
            background: #8b45c5;
            box-shadow: 0 0 20px rgba(139, 69, 197, 0.8);
            animation: teaserPulse 3s ease-in-out infinite;
        }

        @keyframes teaserPulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.8); opacity: 0.5; }
        }

        /* Focus states for keyboard navigation */
        .flow-card:focus {
            outline: none;
            transform: translateY(-12px);
            border-color: rgba(139, 69, 197, 0.6);
            box-shadow: 0 20px 60px rgba(139, 69, 197, 0.4);
        }

        .back-link:focus {
            outline: 2px solid rgba(139, 69, 197, 0.6);
            outline-offset: 4px;
        }

        /* Touch device support */
        body.touch-device {
            cursor: auto;
        }

        body.touch-device .cursor,
        body.touch-device .cursor-dot {
            display: none;
        }

        body.touch-device .flow-card,
        body.touch-device .back-link {
            cursor: pointer;
        }

        /* Reduced motion support */
        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .page-title {
                font-size: 2.5rem;
                margin-bottom: 0.5rem;
            }

            .page-subtitle {
                font-size: 0.95rem;
                margin-bottom: 4rem;
            }

            .flow-grid {
                grid-template-columns: 1fr;
                gap: 2rem;
            }

            header {
                padding: 1rem 0 2rem 0;
            }
        }

        /* Theme Toggle Styles */
        #theme-toggle {
            position: fixed;
            top: 30px;
            right: 30px;
            z-index: 10001;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(139, 69, 197, 0.2);
            border: 2px solid rgba(139, 69, 197, 0.4);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        #theme-toggle:hover {
            transform: scale(1.1) rotate(10deg);
            background: rgba(139, 69, 197, 0.3);
            border-color: rgba(139, 69, 197, 0.6);
            box-shadow: 0 4px 20px rgba(139, 69, 197, 0.3);
        }

        #theme-toggle:active {
            transform: scale(0.95);
        }

        .theme-icon {
            user-select: none;
            pointer-events: none;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.2));
        }

        [data-theme="light"] #theme-toggle {
            background: rgba(52, 152, 219, 0.15);
            border-color: rgba(52, 152, 219, 0.3);
        }

        [data-theme="light"] #theme-toggle:hover {
            background: rgba(52, 152, 219, 0.25);
            border-color: rgba(52, 152, 219, 0.5);
            box-shadow: 0 4px 20px rgba(52, 152, 219, 0.2);
        }

    </style>
</head>
<body>
    <!-- Theme Toggle Button -->
    <button id="theme-toggle" onclick="toggleTheme()" aria-label="Toggle theme">
        <span class="theme-icon">☀️</span>
    </button>

    <!-- Flowing gradient background -->
    <div class="bg-gradient"></div>

    <!-- Custom cursor -->
    <div class="cursor"></div>
    <div class="cursor-dot"></div>

    <!-- Canvas for particles -->
    <canvas id="canvas"></canvas>

    <div class="container">
        <!-- Header -->
        <header>
            <a href="index.html" class="logo">
                <span class="dot-accent">·</span> the moving dot
            </a>
            <a href="index.html" class="back-link">← BACK</a>
        </header>

        <!-- Title -->
        <h1 class="page-title">Flow</h1>
        <p class="page-subtitle">Perspectives on transport and urban movement</p>

        <!-- Flow Grid — topic cards will be added here -->
        <div class="flow-grid">
            <!-- Teaser shown until the first topic cards land -->
            <div class="flow-teaser" style="grid-column: 1 / -1;">
                <div class="flow-teaser-accent"></div>
                <h2 class="flow-teaser-title">The first perspectives are forming</h2>
                <p class="flow-teaser-text">Positions, evidence, and shareable artifacts on how cities move &mdash; infographics and slide decks that take a side, arriving soon.</p>
                <p class="flow-teaser-quote">A city is not a place. It is a pattern of movement.</p>
                <div class="flow-teaser-dot"></div>
            </div>

            <!--
            === TOPIC CARD TEMPLATE ===
            Copy this block for each new topic. Replace href with the
            sub-page URL (e.g. flow/congestion-symptom.html) or an
            external link to a Google Slides / infographic page.

            <a href="#" class="flow-card" target="_blank">
                <div class="flow-card-content">
                    <div class="flow-badge">Position</div>
                    <div class="flow-icon">🚦</div>
                    <h2 class="flow-title">Card Title Here</h2>
                    <p class="flow-description">
                        A one-liner provocation or perspective sentence goes here.
                    </p>
                    <div class="flow-formats">
                        <span class="flow-format-tag">Infographic</span>
                        <span class="flow-format-tag">Slides</span>
                    </div>
                </div>
            </a>
            -->
        </div>
    </div>

    <script>
        // Detect touch device
        function isTouchDevice() {
            return (('ontouchstart' in window) ||
                (navigator.maxTouchPoints > 0) ||
                (navigator.msMaxTouchPoints > 0));
        }

        if (isTouchDevice()) {
            document.body.classList.add('touch-device');
        }

        // Canvas setup
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        // Particle system
        const colors = [
            { r: 139, g: 69, b: 197 },   // Purple
            { r: 52, g: 152, b: 219 },   // Blue
            { r: 231, g: 76, b: 60 },    // Red
            { r: 241, g: 196, b: 15 }    // Yellow
        ];

        let colorIndex = 0;
        let colorTransition = 0;
        let themeSoften = 1;

        function getCurrentColor() {
            const nextIndex = (colorIndex + 1) % colors.length;
            const current = colors[colorIndex];
            const next = colors[nextIndex];

            const r = current.r + (next.r - current.r) * colorTransition;
            const g = current.g + (next.g - current.g) * colorTransition;
            const b = current.b + (next.b - current.b) * colorTransition;

            return { r, g, b };
        }

        class Particle {
            constructor() {
                this.reset();
                this.y = Math.random() * canvas.height;
                this.history = [];
            }

            reset() {
                this.x = Math.random() * canvas.width;
                this.y = 0;
                this.speed = 0.2 + Math.random() * 0.5;
                this.size = 1 + Math.random() * 2;
                this.opacity = Math.random() * 0.5 + 0.3;
            }

            update() {
                this.history.push({ x: this.x, y: this.y });
                if (this.history.length > 10) {
                    this.history.shift();
                }

                this.y += this.speed;
                this.x += Math.sin(this.y * 0.01) * 0.5;

                if (this.y > canvas.height) {
                    this.reset();
                }
            }

            draw() {
                const color = getCurrentColor();

                // Draw trail
                for (let i = 0; i < this.history.length; i++) {
                    const point = this.history[i];
                    const trailOpacity = (i / this.history.length) * this.opacity * 0.3 * themeSoften;
                    ctx.fillStyle = `rgba(${color.r}, ${color.g}, ${color.b}, ${trailOpacity})`;
                    ctx.beginPath();
                    ctx.arc(point.x, point.y, this.size * 0.5, 0, Math.PI * 2);
                    ctx.fill();
                }

                // Draw particle
                ctx.fillStyle = `rgba(${color.r}, ${color.g}, ${color.b}, ${this.opacity * themeSoften})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();

                // Draw glow
                const gradient = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.size * 4);
                gradient.addColorStop(0, `rgba(${color.r}, ${color.g}, ${color.b}, ${this.opacity * 0.2 * themeSoften})`);
                gradient.addColorStop(1, `rgba(${color.r}, ${color.g}, ${color.b}, 0)`);
                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size * 4, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // Create particles (reduced count on mobile for better performance)
        const particles = [];
        const particleCount = window.innerWidth < 768 ? 30 : 50;
        for (let i = 0; i < particleCount; i++) {
            particles.push(new Particle());
        }

        // Connection lines
        function drawConnections() {
            const color = getCurrentColor();
            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < 150) {
                        const opacity = (1 - distance / 150) * 0.15 * themeSoften;
                        ctx.strokeStyle = `rgba(${color.r}, ${color.g}, ${color.b}, ${opacity})`;
                        ctx.lineWidth = 0.5;
                        ctx.beginPath();
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.stroke();
                    }
                }
            }
        }

        // Animation loop
        function animate() {
            // Update color transition
            colorTransition += 0.002;
            if (colorTransition >= 1) {
                colorTransition = 0;
                colorIndex = (colorIndex + 1) % colors.length;
            }

            const theme = document.documentElement.getAttribute('data-theme') || 'dark';
            themeSoften = theme === 'dark' ? 1 : 0.5;
            ctx.fillStyle = theme === 'dark' ? 'rgba(0, 0, 0, 0.1)' : 'rgba(255, 255, 255, 0.16)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            drawConnections();

            particles.forEach(particle => {
                particle.update();
                particle.draw();
            });

            requestAnimationFrame(animate);
        }

        animate();

        // Handle resize
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        // Custom cursor (only on non-touch devices)
        const cursor = document.querySelector('.cursor');
        const cursorDot = document.querySelector('.cursor-dot');

        if (!isTouchDevice()) {
            let mouseX = 0;
            let mouseY = 0;
            let cursorX = 0;
            let cursorY = 0;
            let dotX = 0;
            let dotY = 0;

            document.addEventListener('mousemove', (e) => {
                mouseX = e.clientX;
                mouseY = e.clientY;
            });

            function updateCursor() {
                cursorX += (mouseX - cursorX) * 0.15;
                cursorY += (mouseY - cursorY) * 0.15;
                dotX += (mouseX - dotX) * 0.25;
                dotY += (mouseY - dotY) * 0.25;

                cursor.style.left = cursorX + 'px';
                cursor.style.top = cursorY + 'px';
                cursorDot.style.left = dotX + 'px';
                cursorDot.style.top = dotY + 'px';

                requestAnimationFrame(updateCursor);
            }

            updateCursor();

            // Cursor hover effects
            const flowCards = document.querySelectorAll('.flow-card, .back-link');
            flowCards.forEach(card => {
                card.addEventListener('mouseenter', () => {
                    cursor.style.transform = 'translate(-50%, -50%) scale(1.5)';
                });
                card.addEventListener('mouseleave', () => {
                    cursor.style.transform = 'translate(-50%, -50%) scale(1)';
                });
            });

            // Hide cursor when leaving page
            document.addEventListener('mouseleave', () => {
                cursor.style.opacity = '0';
                cursorDot.style.opacity = '0';
            });

            document.addEventListener('mouseenter', () => {
                cursor.style.opacity = '1';
                cursorDot.style.opacity = '1';
            });
        }
    </script>

    <!-- Agent chat widget (shared) -->
    <script src="chat.js" defer></script>

    <!-- Theme Toggle Script -->
    <script src="theme.js"></script>
</body>
</html>
