<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Moving Dot · Transport, data and AI</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@300;400&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="manifest" href="/manifest.json">
    <link rel="canonical" href="https://themovingdot.com/">
    <meta name="description" content="The Moving Dot: AI traffic counting, transport modelling and the software behind them. Working with clients worldwide.">
    <meta name="author" content="The Moving Dot Ltd">
    <meta name="copyright" content="Platform software © 2022-2026 The Moving Dot Ltd. All rights reserved.">
    <meta property="og:title" content="The Moving Dot · Transport, data and AI">
    <meta property="og:description" content="AI traffic counting, transport modelling and the software behind them.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://themovingdot.com/">
    <meta property="og:image" content="https://themovingdot.com/assets/og-image.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://themovingdot.com/assets/og-image.png">
    <style>
        :root { --accent: #8b45c5; --accent-2: #3498db; }

        :root[data-theme="dark"] {
            color-scheme: dark;
            --bg: #0b0b0e;
            --surface: #15151a;
            --text: #ececf1;
            --text-2: #9b9aa8;
            --line: rgba(255, 255, 255, 0.10);
        }

        :root[data-theme="light"] {
            color-scheme: light;
            --bg: #fbfbfc;
            --surface: #ffffff;
            --text: #141418;
            --text-2: #5d5c6b;
            --line: rgba(0, 0, 0, 0.10);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'DM Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        a { color: inherit; }

        button { font: inherit; color: inherit; }

        :focus-visible { outline: 2px solid var(--accent-2); outline-offset: 3px; border-radius: 4px; }

        .top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 22px 28px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            font-family: 'Crimson Pro', Georgia, serif;
            font-size: 1.2rem;
        }

        .dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: #f1c40f;
            box-shadow: 0 0 10px rgba(241, 196, 15, 0.6);
        }

        #theme-toggle {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            border: 1px solid var(--line);
            background: none;
            cursor: pointer;
            font-size: 0.95rem;
            display: grid;
            place-items: center;
        }

        .theme-icon { pointer-events: none; }

        main {
            flex: 1;
            width: 100%;
            max-width: 720px;
            margin: 0 auto;
            padding: 9vh 24px 60px;
        }

        h1 {
            font-family: 'Crimson Pro', Georgia, serif;
            font-weight: 300;
            font-size: clamp(2.4rem, 7vw, 3.8rem);
            line-height: 1.08;
        }

        .lede {
            margin-top: 16px;
            color: var(--text-2);
            font-size: 1.05rem;
        }

        /* the four lines of business */
        .areas {
            list-style: none;
            margin-top: 56px;
            border-top: 1px solid var(--line);
        }

        .go { margin-top: 48px; font-family: 'Crimson Pro', Georgia, serif; font-size: 1.6rem; }
        .go a { text-decoration: none; border-bottom: 1px solid var(--line); transition: border-color 0.2s; }
        .go a:hover { border-color: var(--accent); }
        .mail { margin-top: 40px; }
        .mail a { color: var(--text-2); text-decoration: none; border-bottom: 1px solid var(--line); }
        .mail a:hover { color: var(--text); }

        footer {
            padding: 24px 104px 32px 28px;
            color: var(--text-2);
            font-size: 0.76rem;
            display: flex;
            flex-wrap: wrap;
            gap: 6px 18px;
            justify-content: space-between;
        }

        footer nav { display: flex; gap: 16px; }

        footer a { text-decoration: none; }

        footer a:hover { color: var(--text); }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
        }

        @media (max-width: 600px) {
            .top { padding: 18px 18px; }
            main { padding: 6vh 18px 40px; }
            footer { padding: 20px 18px 96px; }
        }
    </style>
</head>
<body>
    <header class="top">
        <a class="brand" href="/"><span class="dot" aria-hidden="true"></span>the moving dot</a>
        <button id="theme-toggle" onclick="toggleTheme()" aria-label="Toggle theme"><span class="theme-icon">☀️</span></button>
    </header>

    <main>
        <h1>Transport, data and AI.</h1>
        <p class="lede">Built by The Moving Dot. Working with clients worldwide.</p>

        <p class="go"><a href="https://transport.themovingdot.com">Transport modelling &amp; consultancy <span aria-hidden="true">&#8599;</span></a></p>

        <p class="mail"><a href="mailto:info@themovingdot.com">info@themovingdot.com</a></p>
    </main>

    <footer>
        <span>Platform software &copy; 2022&ndash;<span id="tmd-year">2026</span> The Moving Dot Ltd. All rights reserved.</span>
        <nav aria-label="More"><a href="/lab">Lab</a><a href="/flow">Flow</a><a href="/philosophy">Philosophy</a></nav>
    </footer>

    <script src="/theme.js"></script>
    <script>document.getElementById('tmd-year').textContent = new Date().getFullYear();</script>
    <script src="/assets/feedback.js" data-site="themovingdot.com" data-button="off"></script>
    <script src="/assets/chatbot.js"></script>
</body>
</html>
