<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>the moving dot</title>

    <!-- Fallback for hosts that do not honour _redirects. The server-side
         rule in /_redirects is the primary redirect; this only fires if the
         file is served directly. -->
    <meta http-equiv="refresh" content="0; url=https://transport.themovingdot.com/">
    <link rel="canonical" href="https://transport.themovingdot.com/">
    <meta name="robots" content="noindex, follow">

    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <meta name="theme-color" content="#000000">

    <script>
        // Belt and braces: meta refresh is honoured everywhere, but this makes
        // the hop immediate and keeps the old URL out of the back-button trap.
        window.location.replace('https://transport.themovingdot.com/');
    </script>

    <style>
        :root { color-scheme: dark; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000000;
            color: #a0a0a8;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            font-size: 0.95rem;
            text-align: center;
            padding: 2rem;
        }

        a { color: #8b45c5; }
    </style>
</head>
<body>
    <p>
        Redirecting to
        <a href="https://transport.themovingdot.com/">transport.themovingdot.com</a>&nbsp;…
    </p>
</body>
</html>
