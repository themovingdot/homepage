<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Moving Dot · Understand how people move</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
    <link rel="manifest" href="/manifest.json">
    <link rel="canonical" href="https://themovingdot.com/">
    <meta name="description" content="The Moving Dot: traffic counts, transport models and tools, built with AI. Working with clients worldwide.">
    <meta name="author" content="The Moving Dot Ltd">
    <meta name="copyright" content="Platform software © 2022-2026 The Moving Dot Ltd. All rights reserved.">
    <meta property="og:title" content="The Moving Dot · Understand how people move">
    <meta property="og:description" content="Traffic counts, transport models and tools, built with AI.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://themovingdot.com/">
    <meta property="og:image" content="https://themovingdot.com/assets/og-image.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://themovingdot.com/assets/og-image.png">
    <style>
        :root, :root[data-theme="light"] {
            color-scheme: light;
            --bg: #ffffff; --ink: #0a0a0a; --mute: #767676; --line: #0a0a0a; --acc: #ffd400;
        }
        :root[data-theme="dark"] {
            color-scheme: dark;
            --bg: #0a0a0a; --ink: #fafafa; --mute: #8a8a8a; --line: #fafafa;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--bg); color: var(--ink);
            font: 400 15px/1.5 Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
            min-height: 100dvh; display: flex; flex-direction: column;
        }
        a { color: inherit; text-decoration: none; }
        button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
        :focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
        .mono { font: 400 12px/1 "JetBrains Mono", ui-monospace, monospace; text-transform: uppercase; letter-spacing: .08em; }
        .top { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 20px 36px; border-bottom: 1px solid var(--line); }
        .brand { display: flex; gap: 10px; align-items: center; }
        .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--acc); }
        .top-r { display: flex; gap: 22px; align-items: center; }
        .top-r .steps { color: var(--mute); }
        #theme-toggle { text-transform: uppercase; }
        main { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; }
        h1 { font: 700 clamp(3rem, 10.5vw, 9.5rem)/.9 Inter, sans-serif; letter-spacing: -.06em; padding: 0 36px 26px; }
        h1 span { color: var(--mute); }
        .lede { padding: 0 36px 30px; max-width: 46ch; font-size: 18px; color: var(--mute); }
        .row { display: flex; justify-content: space-between; align-items: center; padding: 22px 36px; border-top: 1px solid var(--line); font-size: clamp(1.1rem, 2.4vw, 1.6rem); font-weight: 500; letter-spacing: -.02em; transition: background .2s, color .2s; }
        .row:hover { background: var(--ink); color: var(--bg); }
        .row .mono { margin-right: 18px; }
        footer { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 24px; padding: 20px 104px 22px 36px; border-top: 1px solid var(--line); color: var(--mute); }
        footer nav { display: flex; gap: 18px; }
        footer a:hover { color: var(--ink); }
        @media (prefers-reduced-motion: reduce) { * { transition-duration: .01ms !important; } }
        @media (max-width: 600px) {
            .top { padding: 16px 20px; }
            .top-r .steps { display: none; }
            h1, .lede { padding-left: 20px; padding-right: 20px; }
            .row { padding: 20px; }
            footer { padding: 18px 20px 92px; }
        }
    </style>
    <script>
        // Light by default; follow the visitor's system, and remember a manual choice.
        (function () {
            var t = null;
            try { t = localStorage.getItem('tmd-home-theme'); } catch (e) { /* storage blocked */ }
            if (!t) t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', t);
        })();
    </script>
</head>
<body>
    <header class="top mono">
        <a class="brand" href="/"><span class="dot" aria-hidden="true"></span>The Moving Dot</a>
        <div class="top-r">
            <span class="steps">Sense · Understand · Reach</span>
            <button id="theme-toggle" type="button" aria-label="Switch colour mode"></button>
        </div>
    </header>

    <main>
        <h1>Understand<br>how people<br><span>move.</span></h1>
        <p class="lede">Traffic counts, transport models and tools, built with AI.</p>
        <a class="row" href="https://transport.themovingdot.com"><span><span class="mono">01</span>Transport modelling &amp; consultancy</span><span aria-hidden="true">&rarr;</span></a>
    </main>

    <footer class="mono">
        <a href="mailto:info@themovingdot.com">info@themovingdot.com</a>
        <nav aria-label="More"><a href="/lab">Lab</a><a href="/flow">Flow</a><a href="/philosophy">Philosophy</a></nav>
        <span>Platform software &copy; 2022&ndash;<span id="tmd-year">2026</span> The Moving Dot Ltd. All rights reserved.</span>
    </footer>

    <script>
        document.getElementById('tmd-year').textContent = new Date().getFullYear();
        (function () {
            var root = document.documentElement, btn = document.getElementById('theme-toggle');
            function label() { btn.textContent = root.getAttribute('data-theme') === 'dark' ? 'Light' : 'Dark'; }
            btn.addEventListener('click', function () {
                var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
                root.setAttribute('data-theme', next);
                try { localStorage.setItem('tmd-home-theme', next); } catch (e) { /* storage blocked */ }
                label();
            });
            label();
        })();
    </script>
    <script type="module" src="/assets/copilot.js"></script>
</body>
</html>
